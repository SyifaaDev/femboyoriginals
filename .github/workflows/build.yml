name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686

      - name: Compile resource (icon)
        run: i686-w64-mingw32-windres resource.rc -O coff -o resource.o

      - name: Compile
        run: |
          i686-w64-mingw32-g++ femboywiper.cpp resource.o -o app.exe -O2 -std=c++17 \
            -static -static-libgcc -static-libstdc++ \
            -D_WIN32_WINNT=0x0601 -s

      - uses: actions/upload-artifact@v4
        with:
          name: FemboyOriginals
          path: app.exe
